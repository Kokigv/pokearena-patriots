# Servicios de PokéArena. La API y la web se agregan en los siguientes commits.
name: pokearena

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://pokearena:pokearena@postgres:5432/pokearena
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-cambie-este-secreto-en-produccion-32b}
  ADMIN_SUBJECTS: ${ADMIN_SUBJECTS:-admin-1}
  # Las réplicas comparten un volumen para las imágenes. En la nube se usa un almacenamiento
  # de objetos (STORAGE_BACKEND=s3 o el adaptador de Azure Blob del despliegue).
  STORAGE_BACKEND: local
  STORAGE_LOCAL_PATH: /data/images
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pokearena
      POSTGRES_USER: pokearena
      POSTGRES_PASSWORD: pokearena
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokearena"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Pruebas automáticas dentro de Docker, sin instalar Python en la máquina:
  #   docker compose run --rm tests
  # Usan la base pokearena_test (se crea sola si no existe) y la borran en cada corrida.
  tests:
    build: ./api
    profiles: ["test"]
    working_dir: /app
    volumes: ["./api:/app", "pip-cache:/root/.cache/pip"]
    environment:
      DATABASE_URL: postgresql+psycopg://pokearena:pokearena@postgres:5432/pokearena_test
      REDIS_URL: redis://redis:6379/15
      PYTHONPATH: src
    command:
      - sh
      - -c
      - >-
        python scripts/create_test_db.py &&
        pip install -q --disable-pip-version-check -e ".[dev]" &&
        ruff format --check . && ruff check . && mypy && pytest -q
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  pip-cache:
