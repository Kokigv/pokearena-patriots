[project]
name = "pokearena-api"
version = "0.1.0"
description = "API de PokéArena"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "pillow>=10.4",
    "pyjwt>=2.9",
    "boto3>=1.35",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "pyyaml>=6.0",
    "types-redis",
    "boto3-stubs[s3]",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "N818"]  # B008: FastAPI usa Depends(); N818: errores con nombre de dominio

[tool.mypy]
python_version = "3.12"
packages = ["pokearena"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pokearena.catalog.domain.*", "pokearena.catalog.application.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: pruebas de rendimiento con 10.000 cartas"]
